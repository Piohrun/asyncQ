services:
  grafana:
    image: grafana/grafana:13.1.1@sha256:7cb8c64c4d57a57e734073f3cc94620adb24a0acb929bd80ba9f14017e3a975b
    container_name: asyncq-demo-grafana
    labels:
      io.asyncq.demo.ownership-token: "${ASYNCQ_DEMO_COMPOSE_OWNERSHIP_TOKEN:-manual}"
      io.asyncq.demo.q-port: "${ASYNCQ_DEMO_Q_PORT:-5000}"
    network_mode: host
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_LOG_LEVEL: info
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3000"
      ASYNCQ_DEMO_Q_PORT: "${ASYNCQ_DEMO_Q_PORT:-5000}"
      ASYNCQ_DEMO_TEMPLATE_DIR: /var/lib/grafana/asyncq/templates
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: asyncq-kdbbackend-datasource,asyncq-masterdata-panel,asyncq-excel-report-panel
      GF_PLUGINS_PREINSTALL: volkovlabs-table-panel@3.6.5,volkovlabs-echarts-panel@7.2.5,volkovlabs-form-panel@6.3.4
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ../dist:/var/lib/grafana/plugins/asyncq-kdbbackend-datasource:ro
      - ../dist-panel/asyncq-masterdata-panel:/var/lib/grafana/plugins/asyncq-masterdata-panel:ro
      - ../dist-panel/asyncq-excel-report-panel:/var/lib/grafana/plugins/asyncq-excel-report-panel:ro
      - ./templates:/var/lib/grafana/asyncq/templates:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./runtime/docker-datasource-${ASYNCQ_DEMO_Q_PORT:-5000}.yml:/etc/grafana/provisioning/datasources/asyncq.yml:ro
